        <style>
  /* Le grand cadre noir de la pellicule */
  .film-strip-gallery {
    width: 100%;
    max-width: 650px; /* Forme rectangulaire verticale comme un ruban */
    height: 80vh;
    margin: 40px auto;
    background-color: #0a0a0a; /* Noir très profond */
    padding: 0 50px; /* On laisse de la place sur les côtés pour les trous */
    position: relative;
    border-radius: 8px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  /* Les perforations de la pellicule (les petits carrés clairs) */
  .film-strip-gallery::before,
  .film-strip-gallery::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 20px;
    /* On crée une répétition de rectangles qui ressemblent aux trous */
    background-image: repeating-linear-gradient(to bottom, #dcdcdc 0px, #dcdcdc 15px, transparent 15px, transparent 30px);
    z-index: 10;
    opacity: 0.7;
  }

  /* Placement des perforations à gauche et à droite */
  .film-strip-gallery::before { left: 15px; }
  .film-strip-gallery::after { right: 15px; }

  /* Le carrousel au centre */
  .swiper.vertical-gallery {
    width: 100%;
    height: 100%;
  }

  /* Les photos (qui représentent les "cases" de la pellicule) */
  .vertical-gallery .swiper-slide {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .vertical-gallery .swiper-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 2px;
    filter: contrast(1.05); /* Donne un tout petit effet "photo développée" */
  }
</style>
